<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Okan para Academias | Cadastro</title>
    <link rel="stylesheet" href="css/style.css?v=4.0">
</head>
<body class="auth-register-page">
    <div class="login-container auth-register-container">
        <div class="login-box auth-box auth-box-left">
            <header class="auth-brand" aria-labelledby="auth-title">
                <span class="auth-product-name">Okan para Academias</span>
                <h1 id="auth-title">Cadastre sua academia</h1>
                <p>Organize sua equipe e acompanhe a operação em um só lugar.</p>
            </header>
            
            <form id="register-form" aria-describedby="error-message">
                <h2 class="auth-section-title">1. Dados da Academia</h2>
                
                <div class="input-group">
                    <label for="reg-gym-name">Nome da Academia</label>
                    <input type="text" id="reg-gym-name" required placeholder="Ex: SmartFit Centro">
                </div>

                <div class="form-row">
                    <div class="input-group">
                        <label for="reg-cnpj">CNPJ</label>
                        <input type="text" id="reg-cnpj" required maxlength="18" placeholder="00.000.000/0000-00">
                    </div>
                    <div class="input-group">
                        <label for="reg-telefone">Telefone da Unidade</label>
                        <input type="tel" id="reg-telefone" required maxlength="15" placeholder="(00) 00000-0000">
                    </div>
                </div>

                <div class="form-row">
                    <div class="input-group" style="flex: 0.4;">
                        <label for="reg-cep">CEP</label>
                        <input type="text" id="reg-cep" required maxlength="9" placeholder="00000-000">
                    </div>
                    <div class="input-group" style="flex: 1;">
                        <label for="reg-endereco">Rua/Av. e Número</label>
                        <input type="text" id="reg-endereco" required placeholder="Sua rua, 123">
                    </div>
                </div>

                <div class="form-row">
                    <div class="input-group">
                        <label for="reg-bairro">Bairro</label>
                        <input type="text" id="reg-bairro" required placeholder="Bairro">
                    </div>
                    <div class="input-group" style="flex: 0.3;">
                        <label for="reg-uf">UF</label>
                        <input type="text" id="reg-uf" required maxlength="2" style="text-transform: uppercase;" placeholder="RJ">
                    </div>
                </div>

                <h2 class="auth-section-title auth-section-title-spaced">2. Dados de Acesso (Gestor)</h2>

                <div class="form-row">
                    <div class="input-group">
                        <label for="reg-admin-name">Seu Nome (Gestor)</label>
                        <input type="text" id="reg-admin-name" required placeholder="Ex: João Silva">
                    </div>
                    <div class="input-group">
                        <label for="reg-email">E-mail Corporativo</label>
                        <input type="email" id="reg-email" required autocomplete="username" placeholder="contato@smartfit.com">
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="input-group">
                        <label for="reg-password">Criar Senha</label>
                        <div class="password-field">
                            <input type="password" id="reg-password" required autocomplete="new-password" placeholder="Mínimo 6 letras">
                            <button type="button" id="toggle-reg-password" class="password-toggle" aria-controls="reg-password" aria-label="Mostrar senha" aria-pressed="false">Mostrar</button>
                        </div>
                    </div>
                    <div class="input-group">
                        <label for="reg-confirm-password">Confirmar Senha</label>
                        <div class="password-field">
                            <input type="password" id="reg-confirm-password" required autocomplete="new-password" placeholder="••••••••">
                            <button type="button" id="toggle-reg-confirm-password" class="password-toggle" aria-controls="reg-confirm-password" aria-label="Mostrar confirmação da senha" aria-pressed="false">Mostrar</button>
                        </div>
                    </div>
                </div>
                
                <button type="submit" id="register-btn" class="btn-primary" style="width: 100%; margin-top: 24px; padding: 16px; font-size: 16px;">Cadastrar Academia</button>
            </form>
            <p id="error-message" class="error auth-feedback" role="status" aria-live="polite" aria-atomic="true"></p>

            <p class="auth-legal-copy">
                Ao cadastrar, você confirma que leu nossa <a href="privacidade.html">Política de Privacidade</a>.
            </p>

            <div class="auth-secondary-action">
                Já tem conta? <a href="index.html">Faça login</a>
            </div>
        </div>
    </div>

    <script type="module" src="script/register.js?v=3.0"></script>
</body>
</html>
