# Deploy manual do Okan Web para Firebase Hosting.
# Atualizar a branch main NAO publica automaticamente em producao.

name: Deploy to Firebase Hosting - Manual

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_APP_ACADEMIA_2914D }}
          channelId: live
          projectId: app-academia-2914d